<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    body{
        color: white;
        background-color: rgb(0, 0, 0);
    }
    .container {
      display: flex;
      justify-content: space-between;
    }

    .icon{
      width: 40px;
      height: 40px;
      padding: 4px;
      fill: white;
      
    }

    .main-container{
      display: flex;
      flex: 1;
      position: relative;
    }

    .sidebar{
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px;
    }

    .main-container > video{
      object-fit: fill;
      width: 100%;
    }

    .main-container > div {
    position: absolute;
    bottom: 160px;
    left: 50px;
    }

    #add-button{
      padding: 8px 16px;
      font-size: 20px;
      font-weight: bold;
      background-color: gainsboro;
      color: black;
      border-radius: 10px;
    }

    @media speech {
  h1, h2 {
    voice-stress: strong;
    voice-pitch: low;
  }
    }
    

  </style>

  <body>
    <div class="container">
      <div class="sidebar">
        <!-- Home -->
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5 10v10h14V10"></path>
        </svg>

        <!-- Search -->
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>

        <!-- TV -->
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="12" rx="2"></rect>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>

        <!-- Movies -->
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <line x1="7" y1="5" x2="7" y2="19"></line>
          <line x1="17" y1="5" x2="17" y2="19"></line>
        </svg>

        <!-- Sports -->
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v5"></path>
          <path d="M7 22l3-6"></path>
          <path d="M17 22l-3-6"></path>
          <path d="M8 12l4-2 4 2"></path>
        </svg>

        <!-- Video -->
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="3" y="5" width="15" height="14" rx="2"></rect>
          <polygon points="16,9 21,12 16,15"></polygon>
        </svg>

        <!-- Categories -->
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
        </svg>

        <!-- Profile -->
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 22c1.5-4 14.5-4 16 0"></path>
        </svg>
      </div>
      <div class="main-container">
        <video src="https://motionbgs.com/media/9043/cosmic-drive.960x540.mp4" autoplay="true"></video>
        <div>
            <div class="movie-title">
          <h4>hotstar special</h4>
          <h1>Space Gen</h1>
          <h4 id="sub-title">Chandrayan</h4>
        </div>
        <p>New Release</p>
        <div class="movie-detail">
          <p>2026 &middot</p>
          <p>U/A 13+ &middot</p>
          <p>1 Season &middot</p>
          <p>7 languages</p>
        </div>
        <div class="description">
          <p>
            With all eyes on Vikram's descent, will the spacecraft have a safe
            landing this time around?
          </p>
        </div>
        <div class="genre">
          <p>
            Drama | Inspired by True Events | Patriotism | Race Against Time
          </p>
          <p>ic</p>
        </div>
        <div class="actions">
          <div>
            <span id="play-button">
              <span>ic</span>
              <span>Watch Now</span>
            </span>
            <span id="add-button"> + </span>
          </div>
        </div>
        </div>
      </div>
    </div>
  </body>
</html>
