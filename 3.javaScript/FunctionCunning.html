<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      Function cunning looks like add(1)(3)(4)(5)
      <br />
      It means you will add all these paranthesis one by one.
    </div>
  </body>
  <script>
    const add = (...listOfArray) => {
      let sum = 0;
      for (let i = 0; i < listOfArray.length; i++) {
        console.log("hello", sum);
        sum = listOfArray[i] + sum;
      }
      return sum;
    };

    // Function Cunning 
    function cunning_add (num1)  {
        return (num2) => {
            if(num2) {
                return cunning_add(num1 + num2);
            }
            else{
                return num1;
            }
        }
    }

    console.log(add(1, 2, 3, 4, 5));
    console.log("Cunning Add -> ", cunning_add(1)(2)(3)(4)());
  </script>
